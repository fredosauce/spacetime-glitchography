<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martian Everlocked — Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
            max-height: calc(100vh - 40px);
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 52px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.25);
            background: #0a0710;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 80px 20px;
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: none;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Martian Everlocked</h1>
            <div class="subtitle">A rust world pressed to scratched disc — resonance orbits split into diffraction, everlocked glitch, and night-blue chrome collage.</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="10538" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random Transmission</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Orbital Bands</label>
                    <div class="slider-container">
                        <input type="range" id="bands" min="5" max="26" step="1" value="15" oninput="updateParam('bands', this.value)">
                        <span class="value-display" id="bands-value">15</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Orbit Density</label>
                    <div class="slider-container">
                        <input type="range" id="density" min="60" max="520" step="20" value="280" oninput="updateParam('density', this.value)">
                        <span class="value-display" id="density-value">280</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Resonance Lock</label>
                    <div class="slider-container">
                        <input type="range" id="lock" min="0" max="1" step="0.02" value="0.72" oninput="updateParam('lock', this.value)">
                        <span class="value-display" id="lock-value">0.72</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Disk Tilt</label>
                    <div class="slider-container">
                        <input type="range" id="tilt" min="0.12" max="1" step="0.02" value="0.4" oninput="updateParam('tilt', this.value)">
                        <span class="value-display" id="tilt-value">0.40</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trace Glow</label>
                    <div class="slider-container">
                        <input type="range" id="glow" min="0.2" max="1.6" step="0.05" value="0.75" oninput="updateParam('glow', this.value)">
                        <span class="value-display" id="glow-value">0.75</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Dust Haze</label>
                    <div class="slider-container">
                        <input type="range" id="haze" min="0" max="1" step="0.02" value="0.5" oninput="updateParam('haze', this.value)">
                        <span class="value-display" id="haze-value">0.50</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Glitch Corruption</label>
                    <div class="slider-container">
                        <input type="range" id="glitch" min="0" max="1" step="0.02" value="0.5" oninput="updateParam('glitch', this.value)">
                        <span class="value-display" id="glitch-value">0.50</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Disc Iridescence</label>
                    <div class="slider-container">
                        <input type="range" id="iridescence" min="0" max="1" step="0.02" value="0.6" oninput="updateParam('iridescence', this.value)">
                        <span class="value-display" id="iridescence-value">0.60</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Night Shift</label>
                    <div class="slider-container">
                        <input type="range" id="nightShift" min="0" max="1" step="0.02" value="0.55" oninput="updateParam('nightShift', this.value)">
                        <span class="value-display" id="nightShift-value">0.55</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Collage Debris</label>
                    <div class="slider-container">
                        <input type="range" id="collage" min="0" max="1" step="0.02" value="0.6" oninput="updateParam('collage', this.value)">
                        <span class="value-display" id="collage-value">0.60</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Ember (inner orbits)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#f4c9a0" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#f4c9a0</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Oxide (planet body)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#b1481f" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#b1481f</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Night (sky &amp; outer orbits)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#2b2e5e" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#2b2e5e</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">Save PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Locking transmission…</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // MARTIAN EVERLOCKED — Movement II: the transmission
        // Orbital resonance pressed to scratched disc: diffraction, everlocked
        // glitch, chrome-fold night sky, and the collage archive at the edges.
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 10538,
            bands: 15,
            density: 280,
            lock: 0.72,
            tilt: 0.4,
            glow: 0.75,
            haze: 0.5,
            glitch: 0.5,
            iridescence: 0.6,
            nightShift: 0.55,
            collage: 0.6,
            colorPalette: ['#f4c9a0', '#b1481f', '#2b2e5e']  // ember, oxide, night
        };
        let defaultParams = JSON.parse(JSON.stringify(params));

        const SIZE = 1200;
        const CX = SIZE / 2;
        const CY = SIZE / 2 + 10;
        const PLANET_R = 138;
        const INNER_R = PLANET_R + 46;
        const OUTER_R = 552;
        const MAX_FRAMES = 1200;

        // Small-integer resonance ratios the orbits snap toward when "locked".
        const HARMONICS = [3, 2.5, 2, 1.6667, 1.5, 1.3333, 1.25, 1,
                           0.8, 0.75, 0.6667, 0.6, 0.5, 0.4, 0.3333, 0.25];

        let orbitLayer, planetLayer, skyLayer, collageLayer;
        let particles = [];
        let stars = [];
        let gSlices = [], gBlocks = [], gScans = [];
        let startFrame = 0;
        let emberC, oxideC, nightC, hazeC, deepFixed;
        let iriStops = [];
        let glareAng = 0;

        // ─── deterministic RNG with independent substreams per subsystem ────────
        let rngState = 1;
        function seedRng(s) { rngState = (Math.abs(Math.floor(s)) % 2147483646) + 1; }
        function rnd() { rngState = (rngState * 16807) % 2147483647; return (rngState - 1) / 2147483646; }
        function rndRange(a, b) { return a + (b - a) * rnd(); }
        function gauss() { return (rnd() + rnd() + rnd() + rnd() - 2) / 2; }
        function fract(x) { return x - Math.floor(x); }

        function setup() {
            let canvas = createCanvas(SIZE, SIZE);
            canvas.parent('canvas-container');
            pixelDensity(1);
            orbitLayer = createGraphics(SIZE, SIZE);
            planetLayer = createGraphics(SIZE, SIZE);
            skyLayer = createGraphics(SIZE, SIZE);
            collageLayer = createGraphics(SIZE, SIZE);
            initializeSystem();
            let ld = document.querySelector('.loading');
            if (ld) ld.style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            let ns = params.nightShift;
            emberC = color(params.colorPalette[0]);
            oxideC = color(params.colorPalette[1]);
            nightC = color(params.colorPalette[2]);
            deepFixed = color(97, 26, 20);
            // limb haze cools toward blue as night falls — the Martian blue sunset
            hazeC = lerpColor(color(214, 150, 110), color(110, 150, 225), ns * 0.85);
            // thin-film diffraction stops for disc iridescence
            iriStops = [emberC, color('#ff5aa2'), color('#5ee7c4'), color('#8a6cff'), color('#ffd9a0')];

            seedRng(params.seed * 7 + 1); buildStars();
            seedRng(params.seed * 7 + 2); buildParticles();
            seedRng(params.seed * 7 + 3); buildPlanet();
            seedRng(params.seed * 7 + 4); buildSky();
            seedRng(params.seed * 7 + 5); buildCollage();
            seedRng(params.seed * 7 + 6); buildGlitch();

            orbitLayer.clear();
            startFrame = frameCount;
            loop();
        }

        // ─── field stars — cooler and more numerous as night deepens ────────────
        function buildStars() {
            stars = [];
            let ns = params.nightShift;
            let n = Math.floor(240 + 180 * ns);
            for (let i = 0; i < n; i++) {
                stars.push({
                    x: rnd() * SIZE,
                    y: rnd() * SIZE,
                    b: rndRange(20, 90),
                    r: rndRange(0.5, 1.6),
                    warm: rnd() < (0.32 * (1 - ns) + 0.08)
                });
            }
        }

        // ─── orbital shells of everlocked particles ─────────────────────────────
        function buildParticles() {
            particles = [];
            let bands = params.bands;
            glareAng = rnd() * TWO_PI;   // where the disc catches the lamp

            // swept resonance-gap radii (Kirkwood-like voids)
            let gaps = [];
            let gapCount = 1 + Math.floor(rnd() * 2);
            for (let g = 0; g < gapCount; g++) gaps.push(rndRange(0.28, 0.82));

            // the single doomed band — tidally captured, decaying inward
            let doomedBand = Math.floor(rndRange(1, bands - 1));

            for (let b = 0; b < bands; b++) {
                let t = bands > 1 ? b / (bands - 1) : 0;
                let baseR = INNER_R + (OUTER_R - INNER_R) * Math.pow(t, 1.06);

                // Keplerian falloff as a ratio to the innermost orbit,
                // snapped toward small-integer harmonics when locked.
                let ratio = Math.pow(INNER_R / baseR, 1.5);
                let snapped = nearestHarmonic(ratio);
                let w = baseSpeed() * lerp(ratio, snapped, params.lock);
                let dir = rnd() < 0.06 ? -1 : 1;
                w *= dir;

                let thickness = rndRange(2.5, 7.5) + (1 - params.lock) * 6;
                let ecc = rndRange(0, 0.10);
                let argP = rnd() * TWO_PI;

                let dens = params.density;
                for (let gp of gaps) {
                    let d = Math.abs(t - gp);
                    if (d < 0.05) dens *= 0.12 + (d / 0.05) * 0.55;
                }
                let count = Math.max(6, Math.floor(dens * rndRange(0.75, 1.15)));

                let isDoomed = (b === doomedBand);

                for (let i = 0; i < count; i++) {
                    let rOff = gauss() * thickness;
                    particles.push({
                        band: b,
                        t: t,
                        r: baseR + rOff,
                        a: rnd() * TWO_PI,
                        w: w * rndRange(0.985, 1.015),
                        ecc: ecc,
                        argP: argP,
                        px: 0, py: 0, has: false,
                        bright: rndRange(0.5, 1) * (0.55 + (1 - t) * 0.75),
                        doomed: isDoomed,
                        decay: isDoomed ? rndRange(0.00018, 0.00040) : 0,
                        aber: rnd() < (0.08 + 0.22 * params.glitch),  // chromatic ghost
                        dust: false,
                        size: rndRange(0.7, 1.7)
                    });
                }
            }

            // drifting dust motes — the perpetual haze
            let motes = Math.floor(700 * params.haze);
            for (let i = 0; i < motes; i++) {
                let rr = rndRange(INNER_R - 24, OUTER_R + 30);
                let tt = constrain((rr - INNER_R) / (OUTER_R - INNER_R), 0, 1);
                let w = baseSpeed() * Math.pow(INNER_R / rr, 1.5) * rndRange(0.6, 1.1);
                particles.push({
                    band: -1, t: tt,
                    r: rr, a: rnd() * TWO_PI, w: w,
                    ecc: rndRange(0, 0.05), argP: rnd() * TWO_PI,
                    px: 0, py: 0, has: false,
                    bright: rndRange(0.06, 0.20),
                    doomed: false, decay: 0, aber: false, dust: true,
                    size: rndRange(1.2, 3.4)
                });
            }
        }

        function baseSpeed() { return 0.022; }

        function nearestHarmonic(x) {
            let best = HARMONICS[0], bd = Infinity;
            for (let h of HARMONICS) {
                let d = Math.abs(h - x);
                if (d < bd) { bd = d; best = h; }
            }
            return best;
        }

        // ─── the red world: shaded sphere, blue-hour limb ───────────────────────
        function buildPlanet() {
            let g = planetLayer;
            let ns = params.nightShift;
            g.clear();
            g.push();
            g.translate(CX, CY);

            // atmospheric limb haze — butterscotch at noon, blue at dusk
            for (let i = 24; i > 0; i--) {
                let rr = PLANET_R + i * 3.4;
                let a = map(i, 24, 0, 0, 34) * (0.5 + params.haze * 0.9);
                g.noStroke();
                g.fill(red(hazeC), green(hazeC), blue(hazeC), a);
                g.ellipse(0, 0, rr * 2, rr * 2);
            }

            // lit sphere via offset radial gradient (light from upper-left)
            let ctx = g.drawingContext;
            let lx = -PLANET_R * 0.42, ly = -PLANET_R * 0.42;
            let grad = ctx.createRadialGradient(lx, ly, PLANET_R * 0.15, 0, 0, PLANET_R * 1.32);
            let lit = lerpColor(oxideC, emberC, 0.55);
            let mid = oxideC;
            let dark = lerpColor(oxideC, color(8, 4, 3), 0.72);
            grad.addColorStop(0.0, rgbaOf(lerpColor(lit, color(255, 240, 225), 0.25), 1));
            grad.addColorStop(0.32, rgbaOf(lit, 1));
            grad.addColorStop(0.62, rgbaOf(mid, 1));
            grad.addColorStop(0.86, rgbaOf(dark, 1));
            grad.addColorStop(1.0, rgbaOf(lerpColor(dark, color(0), 0.4), 1));
            ctx.fillStyle = grad;
            g.noStroke();
            g.ellipse(0, 0, PLANET_R * 2, PLANET_R * 2);

            // surface mottling — regolith provinces, clipped to the disk
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, 0, PLANET_R, 0, TWO_PI);
            ctx.clip();
            for (let i = 0; i < 2200; i++) {
                let ang = rnd() * TWO_PI;
                let rad = Math.sqrt(rnd()) * PLANET_R;
                let x = Math.cos(ang) * rad, y = Math.sin(ang) * rad;
                let lightFac = constrain(1 - (dist(x, y, lx, ly) / (PLANET_R * 2.0)), 0, 1);
                let n = noise(x * 0.012 + 40, y * 0.012 + 40);
                let sz = rndRange(3, 16);
                let dv = (n - 0.5);
                let base = lerpColor(dark, lit, lightFac);
                let sc = lerpColor(base, dv > 0 ? emberC : color(20, 10, 8), Math.abs(dv) * 1.3);
                g.noStroke();
                g.fill(red(sc), green(sc), blue(sc), 26);
                g.ellipse(x, y, sz, sz);
            }
            for (let i = 0; i < 3; i++) {
                let ang = rndRange(-1, 1) * 0.6 - HALF_PI + (rnd() < 0.5 ? PI : 0);
                let rad = PLANET_R * rndRange(0.7, 0.92);
                let x = Math.cos(ang) * rad, y = Math.sin(ang) * rad;
                g.fill(238, 226, 210, 40);
                g.ellipse(x, y, rndRange(20, 46), rndRange(14, 30));
            }
            ctx.restore();

            // terminator shadow on the far lower-right
            let tg = ctx.createRadialGradient(-lx, -ly, PLANET_R * 0.1, -lx * 0.2, -ly * 0.2, PLANET_R * 1.7);
            tg.addColorStop(0, 'rgba(0,0,0,0.55)');
            tg.addColorStop(0.5, 'rgba(0,0,0,0.12)');
            tg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, 0, PLANET_R, 0, TWO_PI);
            ctx.clip();
            ctx.fillStyle = tg;
            ctx.fillRect(-PLANET_R, -PLANET_R, PLANET_R * 2, PLANET_R * 2);
            ctx.restore();

            // blue-hour rim light on the shadowed limb
            if (ns > 0.05) {
                g.noFill();
                g.stroke(150, 178, 255, 70 * ns);
                g.strokeWeight(2.5);
                g.arc(0, 0, PLANET_R * 2 - 3, PLANET_R * 2 - 3, QUARTER_PI - 1.0, QUARTER_PI + 1.0);
            }

            g.pop();
        }

        // ─── night sky: gradient, chrome folds, stars, registration grid ────────
        function buildSky() {
            let g = skyLayer;
            let ns = params.nightShift;
            let ctx = g.drawingContext;

            let base = lerpColor(color(11, 8, 7), color(10, 13, 32), ns);
            g.background(red(base), green(base), blue(base));

            let top = lerpColor(color(30, 16, 12), color(20, 26, 74), ns);
            let mid = lerpColor(color(13, 9, 8), color(11, 13, 36), ns);
            let bot = color(44, 21, 10);   // the ground line stays ember
            let grad = ctx.createLinearGradient(0, 0, 0, SIZE);
            grad.addColorStop(0, rgbaOf(top, 0.72));
            grad.addColorStop(0.5, rgbaOf(mid, 0.25));
            grad.addColorStop(1, rgbaOf(bot, 0.55));
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, SIZE, SIZE);

            // chrome folds — airbrushed metal ribbons, creased at midnight
            if (ns > 0.04) {
                let silver = color(190, 205, 240);
                let darkFold = lerpColor(nightC, color(0), 0.45);
                for (let rb = 0; rb < 7; rb++) {
                    let baseY = rnd() * SIZE;
                    let amp = 90 + rnd() * 230;
                    let th = 26 + rnd() * 80;
                    let ph = rnd() * 100;
                    for (let x = 0; x < SIZE; x += 4) {
                        let n1 = noise(x * 0.0022 + ph, rb * 17.3);
                        let y = baseY + (n1 - 0.5) * amp * 2;
                        let n2 = noise(x * 0.009 + ph * 2, 99 + rb * 11);
                        let spec = Math.pow(n2, 2.6) * 2.0;
                        let col = lerpColor(darkFold, silver, constrain(spec, 0, 1));
                        let dfade = constrain(dist(x, y, CX, CY) / (SIZE * 0.45), 0.2, 1);
                        let a = 46 * ns * (0.35 + 0.65 * n2) * dfade;
                        g.stroke(red(col), green(col), blue(col), a);
                        g.strokeWeight(3);
                        g.line(x, y - th / 2, x, y + th / 2);
                        if (n2 > 0.72) {   // bright crease highlight
                            g.stroke(230, 240, 255, 68 * ns * dfade);
                            g.strokeWeight(1);
                            g.line(x, y - th * 0.15, x, y + th * 0.15);
                        }
                    }
                }
            }

            // stars
            g.noStroke();
            for (let s of stars) {
                let cc = s.warm ? [232, 204, 170] : [196, 208, 232];
                g.fill(cc[0], cc[1], cc[2], s.b);
                g.ellipse(s.x, s.y, s.r, s.r);
            }

            // registration crosses — a print proof of space
            let ga = 18 + 36 * params.collage;
            if (ga > 2) {
                g.stroke(224, 214, 192, ga);
                g.strokeWeight(1);
                let gs = 108;
                let ox = rnd() * gs, oy = rnd() * gs;
                for (let x = ox; x < SIZE; x += gs) {
                    for (let y = oy; y < SIZE; y += gs) {
                        g.line(x - 6, y, x + 6, y);
                        g.line(x, y - 6, x, y + 6);
                    }
                }
            }
        }

        // ─── collage archive: calibration bars, scribbled edges, the ¥ tag ──────
        function buildCollage() {
            let g = collageLayer;
            let co = params.collage;
            let ctx = g.drawingContext;
            g.clear();
            if (co <= 0.01) return;

            // bottom amber ground glow
            let bg = ctx.createLinearGradient(0, SIZE - 110, 0, SIZE);
            bg.addColorStop(0, 'rgba(232,140,40,0)');
            bg.addColorStop(1, 'rgba(232,140,40,' + (0.42 * co).toFixed(3) + ')');
            ctx.fillStyle = bg;
            ctx.fillRect(0, SIZE - 110, SIZE, 110);

            // left cyan calibration bar, notched
            g.noStroke();
            let y = 30 + rnd() * 40;
            while (y < SIZE - 60) {
                let seg = 50 + rnd() * 120;
                let cpick = rnd();
                let cc = cpick < 0.5 ? color('#1d9be0') : (cpick < 0.8 ? color('#0f5f8f') : color('#7fd6ff'));
                g.fill(red(cc), green(cc), blue(cc), 190 * co);
                g.rect(6, y, 13, seg);
                y += seg + rnd() * 90 + 14;
            }

            // right-top color column fragments
            let ry = 26 + rnd() * 30;
            for (let i = 0; i < 5; i++) {
                let cols = ['#d24fa0', '#e07038', '#2fae8f', '#8a6cff', '#f4c9a0'];
                let cc = color(cols[Math.floor(rnd() * cols.length)]);
                let h = 24 + rnd() * 60;
                g.fill(red(cc), green(cc), blue(cc), 150 * co);
                g.rect(SIZE - 24, ry, 12, h);
                ry += h + rnd() * 20 + 6;
            }

            // scribbled flora crowding the torn edges
            let count = Math.floor(110 * co);
            for (let i = 0; i < count; i++) {
                let b = rnd();
                let x, yy;
                if (b < 0.45) { x = rnd() * SIZE; yy = SIZE - rnd() * 70; }
                else if (b < 0.65) { x = rnd() * SIZE; yy = rnd() * 60; }
                else if (b < 0.85) { x = rnd() * 70; yy = rnd() * SIZE; }
                else { x = SIZE - rnd() * 70; yy = rnd() * SIZE; }

                let cp = rnd();
                let cc = cp < 0.45 ? color('#2fae8f') : cp < 0.70 ? color('#1d5c46') :
                         cp < 0.82 ? color('#66e0b8') : cp < 0.91 ? color('#d24fa0') : color('#e07038');
                g.stroke(red(cc), green(cc), blue(cc), (90 + rnd() * 110) * (0.5 + 0.5 * co));
                g.strokeWeight(1 + rnd() * 1.8);
                g.noFill();
                g.beginShape();
                let px = x, py = yy;
                let segs = 5 + Math.floor(rnd() * 10);
                for (let s = 0; s < segs; s++) {
                    g.vertex(px, py);
                    px += (rnd() - 0.5) * 26;
                    py += (rnd() - 0.5) * 18;
                }
                g.endShape();
            }

            // the catalog tag — every sky ends up priced
            if (co > 0.25) {
                let a = rnd() * TWO_PI;
                let r = rndRange(OUTER_R * 0.72, OUTER_R * 0.98);
                let sx = constrain(CX + Math.cos(a) * r, 50, SIZE - 130);
                let sy = constrain(CY + Math.sin(a) * r * Math.max(params.tilt, 0.55), 50, SIZE - 90);
                g.push();
                g.translate(sx, sy);
                g.rotate((rnd() - 0.5) * 0.24);
                g.fill(255, 250, 246, 235);
                g.stroke(208, 52, 44, 235);
                g.strokeWeight(3);
                g.rect(0, 0, 80, 36, 5);
                g.noStroke();
                g.fill(208, 52, 44, 245);
                g.textFont('Courier New');
                g.textStyle(BOLD);
                g.textSize(14);
                g.text('¥' + params.seed, 9, 24);
                g.pop();
            }
        }

        // ─── everlocked corruption: seeded once, repeated forever ───────────────
        function buildGlitch() {
            gSlices = []; gBlocks = []; gScans = [];
            let gl = params.glitch;
            let nS = Math.round(gl * 26);
            for (let i = 0; i < nS; i++) {
                let r = rnd();
                if (r < 0.35) {
                    // horizontal band shifted sideways
                    let sh = Math.floor(4 + rnd() * 34);
                    let sy = Math.floor(rnd() * (SIZE - sh));
                    gSlices.push({ type: 'shift', sy: sy, sh: sh, dx: Math.floor((rnd() - 0.5) * 140) });
                } else if (r < 0.6) {
                    // horizontal pixel-sort smear: thin strip stretched wide
                    let sh = Math.floor(24 + rnd() * 140);
                    let sy = Math.floor(rnd() * (SIZE - sh));
                    let sw = Math.floor(2 + rnd() * 4);
                    let sx = Math.floor(60 + rnd() * (SIZE - 360));
                    let dw = Math.floor(50 + rnd() * 230);
                    let dx = rnd() < 0.5 ? Math.max(0, sx - dw) : sx;
                    gSlices.push({ type: 'smearH', sx: sx, sy: sy, sw: sw, sh: sh, dx: dx, dw: dw });
                } else if (r < 0.85) {
                    // vertical cascade smear — data falling out of the image
                    let sw = Math.floor(24 + rnd() * 140);
                    let sx = Math.floor(rnd() * (SIZE - sw));
                    let sh = Math.floor(2 + rnd() * 4);
                    let sy = Math.floor(60 + rnd() * (SIZE - 360));
                    let dh = Math.floor(40 + rnd() * 200);
                    let dy = rnd() < 0.5 ? Math.max(0, sy - dh) : sy;
                    gSlices.push({ type: 'smearV', sx: sx, sy: sy, sw: sw, sh: sh, dy: dy, dh: dh });
                } else {
                    // displaced block
                    let w = Math.floor(20 + rnd() * 80);
                    let h = Math.floor(20 + rnd() * 80);
                    let sx = Math.floor(rnd() * (SIZE - w));
                    let sy = Math.floor(rnd() * (SIZE - h));
                    gSlices.push({ type: 'block', sx: sx, sy: sy, w: w, h: h,
                                   ox: Math.floor((rnd() - 0.5) * 160), oy: Math.floor((rnd() - 0.5) * 90) });
                }
            }
            // neon debris where the data burst
            let nB = Math.round(gl * 30);
            let neon = ['#39ff88', '#2fe8b0', '#c9ffdd', '#39ff88', '#ff4fd8', '#59d7ff'];
            for (let i = 0; i < nB; i++) {
                gBlocks.push({
                    x: rnd() * SIZE, y: rnd() * SIZE,
                    w: 3 + rnd() * 20, h: 3 + rnd() * 14,
                    c: color(neon[Math.floor(rnd() * neon.length)]),
                    a: 120 + rnd() * 120
                });
            }
            let nSc = Math.round(gl * 8);
            for (let i = 0; i < nSc; i++) gScans.push({ y: Math.floor(rnd() * SIZE) });
        }

        function applyGlitch() {
            for (let s of gSlices) {
                if (s.type === 'shift') {
                    copy(0, s.sy, SIZE, s.sh, s.dx, s.sy, SIZE, s.sh);
                } else if (s.type === 'smearH') {
                    copy(s.sx, s.sy, s.sw, s.sh, s.dx, s.sy, s.dw, s.sh);
                } else if (s.type === 'smearV') {
                    copy(s.sx, s.sy, s.sw, s.sh, s.sx, s.dy, s.sw, s.dh);
                } else {
                    copy(s.sx, s.sy, s.w, s.h, s.sx + s.ox, s.sy + s.oy, s.w, s.h);
                }
            }
            noStroke();
            for (let b of gBlocks) {
                fill(red(b.c), green(b.c), blue(b.c), b.a);
                rect(b.x, b.y, b.w, b.h);
            }
            fill(255, 255, 255, 14);
            for (let sc of gScans) rect(0, sc.y, SIZE, 1);
        }

        function rgbaOf(c, a) {
            return 'rgba(' + Math.round(red(c)) + ',' + Math.round(green(c)) + ',' + Math.round(blue(c)) + ',' + a + ')';
        }

        // ─── trace colour: orbital energy ramp, night-shifted at the rim ────────
        function orbitColor(t) {
            let ns = params.nightShift;
            if (t < 0.45) return lerpColor(emberC, oxideC, t / 0.45);
            let outer = lerpColor(deepFixed, nightC, ns);
            return lerpColor(oxideC, outer, (t - 0.45) / 0.55);
        }

        function paletteAt(x) {
            x = fract(x);
            let f = x * iriStops.length;
            let i = Math.floor(f);
            return lerpColor(iriStops[i], iriStops[(i + 1) % iriStops.length], f - i);
        }

        function draw() {
            // advance & etch orbital traces into the accumulation layer
            let iri = params.iridescence;
            orbitLayer.push();
            orbitLayer.translate(CX, CY);
            orbitLayer.blendMode(ADD);
            orbitLayer.noFill();

            for (let p of particles) {
                p.a += p.w;
                if (p.doomed && p.r > PLANET_R + 6) {
                    p.r -= p.decay * p.r;      // decaying, tightening orbit
                    p.w *= 1.00035;            // speeds up as it falls
                }
                let rr = p.r * (1 - p.ecc * Math.cos(p.a - p.argP));
                let x = Math.cos(p.a) * rr;
                let y = Math.sin(p.a) * rr * params.tilt;

                if (p.has && dist(x, y, p.px, p.py) < 60) {
                    let c, al;
                    if (p.dust) {
                        c = hazeC;
                        al = p.bright * 26 * params.glow;
                    } else {
                        c = orbitColor(p.t);
                        al = p.bright * (p.doomed ? 42 : 30) * params.glow;
                        if (iri > 0) {
                            // groove diffraction: hue rotates around the disc,
                            // plus the hard glare wedge where it catches the lamp
                            let idx = fract((p.a / TWO_PI) * 3 + p.t * 1.7);
                            c = lerpColor(c, paletteAt(idx), 0.72 * iri);
                            let spec = Math.pow(Math.max(0, Math.cos(p.a - glareAng)), 12);
                            al *= 1 + spec * 2.6 * iri;
                        }
                        al = Math.min(al, 95);
                    }
                    orbitLayer.stroke(red(c), green(c), blue(c), al);
                    orbitLayer.strokeWeight(p.size);
                    orbitLayer.line(p.px, p.py, x, y);

                    // chromatic aberration ghosts — the dying laser reads double
                    if (p.aber) {
                        let o = 2 + params.glitch * 3.5;
                        let ga2 = al * 0.5;
                        orbitLayer.stroke(255, 45, 90, ga2);
                        orbitLayer.line(p.px + o, p.py, x + o, y);
                        orbitLayer.stroke(70, 170, 255, ga2);
                        orbitLayer.line(p.px - o, p.py, x - o, y);
                    }
                }
                p.px = x; p.py = y; p.has = true;
            }
            orbitLayer.pop();

            // ── composite the frame ──────────────────────────────────────────────
            image(skyLayer, 0, 0);

            blendMode(SCREEN);
            image(orbitLayer, 0, 0);
            blendMode(BLEND);

            image(planetLayer, 0, 0);
            image(collageLayer, 0, 0);

            // everlocked corruption — identical every frame, locked like the moons
            applyGlitch();

            // gentle global vignette
            let vg = drawingContext.createRadialGradient(CX, CY, SIZE * 0.28, CX, CY, SIZE * 0.62);
            vg.addColorStop(0, 'rgba(0,0,0,0)');
            vg.addColorStop(1, 'rgba(0,0,0,0.5)');
            drawingContext.fillStyle = vg;
            drawingContext.fillRect(0, 0, SIZE, SIZE);

            if (frameCount - startFrame > MAX_FRAMES) noLoop();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI HANDLERS
        // ═══════════════════════════════════════════════════════════════════════
        function updateParam(name, value) {
            let v = parseFloat(value);
            params[name] = (name === 'bands' || name === 'density') ? Math.round(v) : v;
            let disp = document.getElementById(name + '-value');
            if (disp) {
                if (name === 'bands' || name === 'density') disp.textContent = params[name];
                else disp.textContent = v.toFixed(2);
            }
            initializeSystem();
        }

        function updateColor(id, value) {
            let idx = { color1: 0, color2: 1, color3: 2 }[id];
            params.colorPalette[idx] = value;
            document.getElementById(id + '-value').textContent = value;
            initializeSystem();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROLS
        // ═══════════════════════════════════════════════════════════════════════
        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }

        function updateSeed() {
            let v = parseInt(document.getElementById('seed-input').value);
            if (v && v > 0) { params.seed = v; initializeSystem(); }
            else updateSeedDisplay();
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed = params.seed + 1; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            let floats = ['lock', 'tilt', 'glow', 'haze', 'glitch', 'iridescence', 'nightShift', 'collage'];
            for (let k of ['bands', 'density'].concat(floats)) {
                let el = document.getElementById(k);
                if (el) el.value = params[k];
                let d = document.getElementById(k + '-value');
                if (d) d.textContent = (k === 'bands' || k === 'density') ? params[k] : Number(params[k]).toFixed(2);
            }
            let ids = ['color1', 'color2', 'color3'];
            for (let i = 0; i < 3; i++) {
                document.getElementById(ids[i]).value = params.colorPalette[i];
                document.getElementById(ids[i] + '-value').textContent = params.colorPalette[i];
            }
            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() { saveCanvas('martian-everlocked-' + params.seed, 'png'); }

        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
